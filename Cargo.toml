[package]
name = "rcshell"
version = "0.2.3"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
debug_print = "1.0.0"
futures = "0.3.34"
gdk-pixbuf = "0.22.11"
gio = "0.22.11"
glib = "0.22.11"
grass = "0.13.4"
gtk4 = { version = "0.11.5" }
gtk4-layer-shell = "0.9.0"
phf = { version = "0.14.0", features = ["macros"] }
tokio = { version = "1.54.1", features = ["full"] }
zbus = "6.5.0"

[profile.prod]
lto = "fat"
inherits = "release"
codegen-units = 1
